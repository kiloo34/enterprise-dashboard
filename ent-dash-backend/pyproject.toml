# Ruff configuration for ent-dash-backend
# Rule 14 compliance: enforced via CI pipeline

[tool.ruff]
# Exclude test fixtures and migration files
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "alembic",
]

line-length = 120

[tool.ruff.lint]
# E = pycodestyle, W = warnings, F = pyflakes
select = ["E", "W", "F"]
ignore = [
    "E501", # line too long — handled by formatter
    "F401", # unused imports in __init__.py (re-export pattern)
]

# Allow unused imports in __init__.py (re-export aggregators)
[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
"app/db/base.py" = ["F401"]

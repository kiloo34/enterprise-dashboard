services:
  traefik:
    image: traefik:v3.0
    container_name: ent_dash_traefik
    command:
      - "--api.insecure=false"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--log.level=FATAL"
      - "--api.insecure=false"
    ports:
      - "8000:80"
      - "127.0.0.1:8080:8080" # Traefik Dashboard — localhost only
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ent_dash_redis
    ports:
      - "127.0.0.1:6379:6379" # localhost only — tidak boleh diakses dari jaringan luar
    restart: always

  db:
    image: postgres:17-alpine
    container_name: ent_dash_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ent_dash_iam
      - POSTGRES_MULTIPLE_DATABASES=ent_dash_iam,cbskonv,ent_dash_engine,ent_dash_analytics
    ports:
      - "127.0.0.1:5434:5432" # localhost only — akses DB hanya dari mesin lokal
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    # I4: Healthcheck — pastikan DB benar-benar siap sebelum service lain startup
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ent_dash_iam" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  recon_api:
    build:
      context: ./ent-dash-recon
      dockerfile: Dockerfile
      additional_contexts:
        common: ./ent-dash-common
    image: ent-dash-recon:latest
    container_name: ent_dash_recon_api
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=cbskonv
      - POSTGRES_PORT=5432
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_TOPIC_DATA_PROCESSED=engine.data_processed
    volumes:
      - recon_uploads:/app/storage/app/imports
    depends_on:
      - redis
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.secure-headers.headers.sslredirect=false"
      - "traefik.http.middlewares.secure-headers.headers.stsseconds=31536000"
      - "traefik.http.middlewares.secure-headers.headers.browserxssfilter=true"
      - "traefik.http.middlewares.secure-headers.headers.customframeoptionsvalue=SAMEORIGIN"
      - "traefik.http.middlewares.auto-retry.retry.attempts=3"
      - "traefik.http.middlewares.auto-retry.retry.initialinterval=100ms"

      - "traefik.http.routers.recon.rule=PathPrefix(`/api/recon`)"
      - "traefik.http.routers.recon.entrypoints=web"
      - "traefik.http.routers.recon.priority=40"
      - "traefik.http.routers.recon.middlewares=secure-headers,auto-retry"
    restart: always

  dw:
    build:
      context: ./ent-dash-dw
      dockerfile: Dockerfile
      additional_contexts:
        common: ./ent-dash-common
    image: ent-dash-dw:latest
    container_name: ent_dash_dw
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=cbskonv
      - POSTGRES_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_TOPIC_DATA_PROCESSED=engine.data_processed
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dw.rule=PathPrefix(`/api/dw`)"
      - "traefik.http.routers.dw.entrypoints=web"
      - "traefik.http.routers.dw.priority=42"
      - "traefik.http.routers.dw.middlewares=secure-headers,auto-retry"
      - "traefik.http.services.dw.loadbalancer.server.port=8000"
    # gRPC port — used by analytics service (internal Docker network only)
    expose:
      - "50051"
    restart: always

  # ─── Recon Celery Worker ──────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./ent-dash-recon
      dockerfile: Dockerfile
      additional_contexts:
        common: ./ent-dash-common
    image: ent-dash-recon:latest
    container_name: ent_dash_celery
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pekalongan12}
      - POSTGRES_DB=cbskonv
      - POSTGRES_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-base64:8C1LsxaMh5a+r++t8oTD0iQllugGC8CF7iWam/Tfaww=}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_TOPIC_DATA_PROCESSED=engine.data_processed
    volumes:
      - recon_uploads:/app/storage/app/imports
    depends_on:
      - redis
      - db
    restart: always

  iam:
    build:
      context: ./ent-dash-iam
      dockerfile: Dockerfile
      additional_contexts:
        common: ./ent-dash-common
    image: ent-dash-iam:latest
    container_name: ent_dash_iam
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ent_dash_iam
      - POSTGRES_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      # Internal service URLs
      - ENGINE_INTERNAL_URL=http://engine:8000
      # CORS — ganti sesuai domain production Anda
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080,http://localhost
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iam.rule=PathPrefix(`/api/auth`) || PathPrefix(`/api/user`) || PathPrefix(`/api/users`) || PathPrefix(`/api/roles`) || PathPrefix(`/api/permissions`) || PathPrefix(`/api/positions`) || PathPrefix(`/api/organization-units`) || PathPrefix(`/api/admin`) || PathPrefix(`/api/system-config`) || PathPrefix(`/api/translations`) || PathPrefix(`/api/navigation`)"
      - "traefik.http.routers.iam.entrypoints=web"
      - "traefik.http.routers.iam.priority=50"
      - "traefik.http.routers.iam.middlewares=secure-headers,auto-retry"
      - "traefik.http.services.iam.loadbalancer.server.port=8000"
      # T1: Rate limit khusus login endpoint — 10 req/menit per IP (anti brute-force)
      - "traefik.http.routers.iam-login.rule=Path(`/api/auth/login`)"
      - "traefik.http.routers.iam-login.entrypoints=web"
      - "traefik.http.routers.iam-login.priority=100"
      - "traefik.http.routers.iam-login.middlewares=login-ratelimit"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.login-ratelimit.ratelimit.burst=5"
    restart: always


  analytics:
    build:
      context: ./ent-dash-analytics
      dockerfile: Dockerfile
      additional_contexts:
        common: ./ent-dash-common
    image: ent-dash-analytics:latest
    container_name: ent_dash_analytics
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ent_dash_analytics
      - POSTGRES_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # gRPC sekarang ke ent-dash-dw (yang punya TABLEAU_REPORT schema di cbskonv)
      - ENGINE_GRPC_HOST=dw
      - ENGINE_GRPC_PORT=50051
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080,http://localhost
    depends_on:
      db:
        condition: service_healthy
      dw:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.analytics.rule=PathPrefix(`/api/dashboard`)"
      - "traefik.http.routers.analytics.entrypoints=web"
      - "traefik.http.routers.analytics.priority=45"
      - "traefik.http.routers.analytics.middlewares=secure-headers,auto-retry"
      - "traefik.http.services.analytics.loadbalancer.server.port=8000"
    restart: always

  engine:
    build:
      context: ./ent-dash-engine
      dockerfile: Dockerfile
      additional_contexts:
        common: ./ent-dash-common
    image: ent-dash-engine:latest
    container_name: ent_dash_engine
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ent_dash_engine
      - POSTGRES_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - RECON_DATABASE_URI=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/ent_dash_recon
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=ent-dash-imports
      - MINIO_USE_SSL=False
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_TOPIC_FILE_UPLOADED=engine.file_uploaded
      - KAFKA_TOPIC_DATA_PROCESSED=engine.data_processed
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080,http://localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      redpanda:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.engine.rule=PathPrefix(`/api/imports`)"
      - "traefik.http.routers.engine.entrypoints=web"
      - "traefik.http.routers.engine.priority=45"
      - "traefik.http.routers.engine.middlewares=secure-headers,auto-retry"
      - "traefik.http.services.engine.loadbalancer.server.port=8000"
    restart: always

  engine_worker:
    build:
      context: ./ent-dash-engine
      dockerfile: Dockerfile
      additional_contexts:
        common: ./ent-dash-common
    image: ent-dash-engine:latest
    container_name: ent_dash_engine_worker
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4 -Q celery
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ent_dash_engine
      - POSTGRES_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - RECON_DATABASE_URI=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/ent_dash_recon
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=ent-dash-imports
      - MINIO_USE_SSL=False
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_TOPIC_FILE_UPLOADED=engine.file_uploaded
      - KAFKA_TOPIC_DATA_PROCESSED=engine.data_processed
    depends_on:
      - db
      - redis
      - minio
      - redpanda
    restart: always

  frontend:
    build:
      context: ./ent-dash-fe
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
        - BACKEND_URL=http://traefik
    image: ent-dash-frontend:latest
    container_name: ent_dash_frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - BACKEND_URL=http://traefik
    depends_on:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
    restart: always

  minio:
    image: minio/minio:latest
    container_name: ent_dash_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000" # MinIO S3 API — localhost only
      - "127.0.0.1:9002:9001" # MinIO Console — localhost only
    volumes:
      - minio_data:/data
    restart: always

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: ent_dash_redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
    ports:
      - "127.0.0.1:19092:19092" # Kafka external — localhost only (internal traffic via Docker network)
      - "127.0.0.1:18082:18082" # Pandaproxy external — localhost only
      - "127.0.0.1:19644:9644"  # Admin API — localhost only
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    restart: always

  redpanda_console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: ent_dash_redpanda_console
    depends_on:
      - redpanda
    environment:
      - KAFKA_BROKERS=redpanda:9092
    # Port direct dihapus — akses via Traefik di /monitoring/redpanda
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redpanda-ui.rule=PathPrefix(`/monitoring/redpanda`)"
      - "traefik.http.routers.redpanda-ui.entrypoints=web"
      - "traefik.http.routers.redpanda-ui.priority=65"
      - "traefik.http.middlewares.redpanda-strip.stripprefix.prefixes=/monitoring/redpanda"
      - "traefik.http.routers.redpanda-ui.middlewares=redpanda-strip"
      - "traefik.http.services.redpanda-ui.loadbalancer.server.port=8080"
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: ent_dash_prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=/monitoring/prometheus'
      - '--web.route-prefix=/'
    # Port direct dihapus — akses via Traefik di /monitoring/prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=PathPrefix(`/monitoring/prometheus`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.routers.prometheus.priority=65"
      - "traefik.http.middlewares.prom-strip.stripprefix.prefixes=/monitoring/prometheus"
      - "traefik.http.routers.prometheus.middlewares=prom-strip"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: ent_dash_grafana
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pekalongan12}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Allow embedding via iframe (for super-admin monitoring page)
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/monitoring/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    # Port direct dihapus — akses via Traefik di /monitoring/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/monitoring/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.priority=65"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - prometheus
    restart: always

volumes:
  pgdata:
    external: true
    name: enterprisedashboard_pgdata
  recon_uploads:
    name: ent_dash_recon_uploads
  minio_data:
    name: ent_dash_minio_data
  redpanda_data:
    name: ent_dash_redpanda_data
  prometheus_data:
    name: ent_dash_prometheus_data
  grafana_data:
    name: ent_dash_grafana_data

name: Enterprise Dashboard CI

on:
  push:
    branches: [ "main", "master", "development" ]
  pull_request:
    branches: [ "main", "master", "development" ]

jobs:
  # ─── FRONTEND QUALITY & BUILD ──────────────────────────────────────────────
  frontend-check:
    name: Frontend (Next.js) Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ent-dash-fe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ent-dash-fe/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        
      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Test Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api

  # ─── BACKEND SECURITY SCAN (SAST) ──────────────────────────────────────────
  backend-security-scan:
    name: Backend Security (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        # Scan all python files in the repo, skip tests if they exist
        run: bandit -r . -x tests

  # ─── DOCKER COMPOSE BUILD TEST ─────────────────────────────────────────────
  docker-build-check:
    name: Microservices Docker Build Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Dummy .env file
        run: cp .env.example .env

      - name: Test Docker Compose Build
        run: docker compose build
        # We only build to ensure Dockerfiles are valid and dependencies download successfully.
        # We do not push to a registry.
        
      - name: Run Trivy vulnerability scanner on IAM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ent-dash-iam:latest'
          format: 'table'
          exit-code: '0' # Set to 1 to fail the build on High/Crit
          severity: 'CRITICAL,HIGH'

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ent-dash-common"
version = "1.0.0"
description = "Shared utilities for Enterprise Dashboard microservices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "prometheus-fastapi-instrumentator>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ent_dash_common*"]
